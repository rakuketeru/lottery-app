<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>抽签活动</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7f7f7;
      padding: 2em;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 1em 2em;
      font-size: 1.2em;
      margin-top: 1em;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 2em;
      font-size: 1.3em;
      color: #333;
    }

    .win {
      color: green;
    }

    .lose {
      color: red;
    }

    .stat {
      margin-top: 1em;
      font-size: 0.95em;
      color: #555;
    }
  </style>
</head>
<body>
  <h1 id="title">🎯 活动标题加载中...</h1>
  <div class="stat" id="stats">正在加载参与数据...</div>
  <button id="drawBtn">点我抽签</button>
  <div class="result" id="resultMsg"></div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const activityId = params.get('activityId')
    const resultMsg = document.getElementById('resultMsg')
    const stats = document.getElementById('stats')
    const title = document.getElementById('title')
    const btn = document.getElementById('drawBtn')

    // 生成并持久保存 uid
    let uid = localStorage.getItem('lottery_uid')
    if (!uid) {
      uid = crypto.randomUUID()
      localStorage.setItem('lottery_uid', uid)
    }

    async function loadStatus() {
      const res = await fetch(`/api/status?activityId=${activityId}`)
      const json = await res.json()

      if (json.error) {
        title.textContent = '❌ 活动不存在'
        btn.disabled = true
        stats.textContent = ''
        return
      }

      title.textContent = `🎯 ${json.title}`
      stats.textContent = `👥 已参与 ${json.total} 人 / 👤 中签 ${json.win} 人`
    }

    async function draw() {
      btn.disabled = true
      btn.textContent = '抽签中...'

      const res = await fetch(`/api/draw?activityId=${activityId}&uid=${uid}`, { method: 'POST' })
      const json = await res.json()

      await loadStatus()

      if (json.alreadyDrawn) {
        resultMsg.innerHTML = json.draw_result
          ? '🎉 你已抽过：<span class="win">中签</span>'
          : '😢 你已抽过：<span class="lose">未中签</span>'
      } else {
        resultMsg.innerHTML = json.draw_result
          ? '🎉 <span class="win">恭喜你，中签啦！</span>'
          : '😢 <span class="lose">很遗憾，未中签</span>'
      }

      btn.textContent = '已抽签'
    }

    document.getElementById('drawBtn').addEventListener('click', draw)

    loadStatus()
  </script>
</body>
</html>
