<script>
  const activityId = new URLSearchParams(location.search).get('activityId');
  const uidKey = `lottery_uid_${activityId}`;
  let uid = localStorage.getItem(uidKey);
  if (!uid) {
    uid = crypto.randomUUID();
    localStorage.setItem(uidKey, uid);
  }

  async function draw() {
    const res = await fetch('/api/draw', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ activityId, uid })
    });

    const result = await res.json();
    if (result.alreadyDrawn) {
      alert(result.draw_result ? '你已经抽中过啦！' : '你已经抽签了，但未中签');
    } else {
      alert(result.draw_result ? '恭喜中签！' : '很遗憾，未中签');
    }
  }

  document.getElementById('drawBtn').addEventListener('click', draw);
</script>
