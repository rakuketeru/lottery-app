<script>
  const urlParams = new URLSearchParams(window.location.search)
  const activityId = urlParams.get('activityId')

  const uid = (() => {
    let id = localStorage.getItem('lottery_uid')
    if (!id) {
      id = crypto.randomUUID()
      localStorage.setItem('lottery_uid', id)
    }
    return id
  })()

  document.getElementById('draw-button').addEventListener('click', async () => {
    const res = await fetch(`/api/draw`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ activityId, uid })
    })

    const result = await res.json()

    if (result.alreadyDrawn) {
      alert(result.draw_result ? '您已抽中 🎉' : '您已抽签，未中签')
    } else {
      alert(result.draw_result ? '恭喜您抽中了 🎊' : '很遗憾，未中签')
    }

    window.location.reload()
  })
</script>
