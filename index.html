<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>抽签页面</title>
  <style>
    body {
      margin: 0;
      padding: 2em;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fffde7);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: white;
      padding: 2em;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 0.5em;
    }

    #stats {
      font-size: 16px;
      color: #555;
    }

    button {
      margin-top: 1.5em;
      padding: 12px 24px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #388e3c;
    }

    #result {
      margin-top: 1.5em;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: #2e7d32;
    }

    .fail {
      color: #c62828;
    }

    .notice {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">🎯 活动加载中...</h1>
    <div id="stats">统计数据加载中...</div>
    <button id="drawBtn">点我抽签</button>
    <div id="result" class="notice"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search)
    const activityId = urlParams.get('activityId')
    const uid = localStorage.getItem('lottery_uid') || crypto.randomUUID()
    localStorage.setItem('lottery_uid', uid)

    async function updateStatus() {
      const res = await fetch(`/api/status?activityId=${activityId}`)
      const data = await res.json()

      if (data.error) {
        document.getElementById('title').innerText = "❌ 活动不存在"
        document.getElementById('drawBtn').disabled = true
        return
      }

      document.getElementById('title').innerText = `🎯 ${data.title}`
      document.getElementById('stats').innerText = `👥 已参与 ${data.total} 人 / 🧧 中签 ${data.win} 人`
    }

    document.getElementById('drawBtn').onclick = async () => {
      const res = await fetch(`/api/draw?activityId=${activityId}&uid=${uid}`)
      const result = await res.json()

      const resultEl = document.getElementById('result')
      if (result.alreadyDrawn) {
        resultEl.className = 'notice'
        resultEl.innerText = `⚠️ 你已经抽过签，结果是：${result.draw_result ? '🎉 中签' : '😢 未中签'}`
      } else if (result.draw_result) {
        resultEl.className = 'success'
        resultEl.innerText = '🎉 恭喜你，中签了！'
      } else {
        resultEl.className = 'fail'
        resultEl.innerText = '😢 很遗憾，未中签'
      }

      await updateStatus()
    }

    updateStatus()
  </script>
</body>
</html>
