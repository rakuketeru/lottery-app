<script>
const urlParams = new URLSearchParams(window.location.search)
const activityId = urlParams.get('activityId')
const userId = urlParams.get('userId') || 'test-user-' + Math.floor(Math.random() * 10000)

document.getElementById('drawBtn').addEventListener('click', async () => {
  const res = await fetch(`/api/draw?activityId=${activityId}&userId=${userId}`)
  const data = await res.json()
  if (data.duplicate) {
    alert('你已经抽过签了！结果是：' + (data.result ? '🎉 恭喜中签！' : '😢 很遗憾，未中签'))
  } else {
    alert(data.result ? '🎉 恭喜中签！' : '😢 很遗憾，未中签')
  }
})
</script>
