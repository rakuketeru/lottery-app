<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>抽签页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      background-color: #f5f5f5;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 1em;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="title">🎯 加载中...</h1>
  <p id="stats">正在加载参与情况...</p>
  <button id="drawBtn">点我抽签</button>
  <div id="result"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search)
    const activityId = urlParams.get('activityId')
    if (!activityId) {
      document.body.innerHTML = "<h2>❌ 缺少 activityId 参数</h2>"
      throw new Error('缺少 activityId')
    }

    // 为每个用户生成唯一 ID（保存在 localStorage 中）
    const uid = localStorage.getItem('lottery_uid') || crypto.randomUUID()
    localStorage.setItem('lottery_uid', uid)

    async function updateStatus() {
      const res = await fetch(`/api/status?activityId=${activityId}`)
      const data = await res.json()

      if (data.error) {
        document.getElementById('title').innerText = "❌ 活动不存在"
        document.getElementById('drawBtn').disabled = true
        return
      }

      document.getElementById('title').innerText = `🎯 ${data.title}`
      document.getElementById('stats').innerText = `👥 已参与 ${data.total} 人 / 🧧 中签 ${data.win} 人`
    }

    document.getElementById('drawBtn').onclick = async () => {
      const res = await fetch(`/api/draw?activityId=${activityId}&uid=${uid}`)
      const result = await res.json()

      if (result.alreadyDrawn) {
        document.getElementById('result').innerText = `⚠️ 你已经抽过签了，结果是：${result.draw_result ? '🎉 中签' : '😢 未中签'}`
      } else if (result.draw_result) {
        document.getElementById('result').innerText = '🎉 恭喜你，中签了！'
      } else {
        document.getElementById('result').innerText = '😢 很遗憾，未中签'
      }

      await updateStatus()
    }

    updateStatus()
  </script>
</body>
</html>
