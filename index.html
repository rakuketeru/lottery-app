<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>抽签活动</title>
</head>
<body>
  <h1 id="activity-title">🎯 活动标题</h1>
  <p>👥 已参与 <span id="total">?</span> 人 / 🧍‍♂️ 中签 <span id="win">?</span> 人</p>
  <button id="drawBtn">点我抽签</button>
  <p id="result"></p>

  <script type="module">
    import { supabase } from './_supabase.js'

    const urlParams = new URLSearchParams(window.location.search)
    const activityId = urlParams.get('activityId')
    const titleEl = document.getElementById('activity-title')
    const totalEl = document.getElementById('total')
    const winEl = document.getElementById('win')
    const resultEl = document.getElementById('result')
    const drawBtn = document.getElementById('drawBtn')

    async function loadStatus() {
      const res = await fetch(`/api/status?activityId=${activityId}`)
      const data = await res.json()

      if (data.error) {
        titleEl.textContent = '❌ 活动不存在'
        drawBtn.disabled = true
        return
      }

      titleEl.textContent = `🎯 ${data.title}`
      totalEl.textContent = data.total
      winEl.textContent = data.win
    }

    drawBtn.addEventListener('click', async () => {
      const res = await fetch(`/api/draw?activityId=${activityId}`, {
        method: 'POST'
      })
      const data = await res.json()
      if (data.error) {
        resultEl.textContent = '⚠️ ' + data.error
      } else if (data.draw_result) {
        resultEl.textContent = '🎉 恭喜你中签了！'
      } else {
        resultEl.textContent = '😢 很遗憾，未中签'
      }
      await loadStatus()
    })

    loadStatus()
  </script>
</body>
</html>
